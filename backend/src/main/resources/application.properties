spring.application.name=backend-glasses
#
# Supabase Postgres uses host: db.<project-ref>.supabase.co with SSL required.
# Provide credentials via environment variables (recommended).
#
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.mjqvtqblzwedykrrlgif.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false